name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs on a pull request, where only the tip matters — but
# never on `main`, where every commit is already merged and each one deserves its
# own verdict.
#
# It used to cancel on `main` too, and that is worse than it sounds in a repo
# several agents push to. A broken commit followed a minute later by a good one
# has its run cancelled and is never reported, so `main` looks green at a commit
# that does not build — which is precisely how a broken `main` went unnoticed
# here. It also mis-notifies: GitHub renders a cancelled run as
# "CI: All jobs have failed", so every rapid second push raises a false alarm.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The differential suite: SimChecks loads the JSON goldens bundled as package
  # resources and replays ~2.2M assertions against the ported model. It prints a
  # PASS line with the assertion count and exits nonzero on any failure, so a
  # plain `swift run` is the whole test harness.
  #
  # macos-15 ships Xcode 16.x, which is the floor for swift-tools-version 6.0
  # (Package.swift). No SPM dependency cache: the package has zero external
  # dependencies (no Package.resolved exists), so there is nothing to restore
  # that a fresh release build would not rebuild anyway.
  sim-tests:
    name: Swift differential suite (SimTests)
    runs-on: macos-15
    # Generous: release-mode build plus ~2.2M assertions.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build and run SimTests
        working-directory: swift
        run: swift run -c release SimTests

  # The iOS app, built for the simulator so no signing identity is needed.
  # The .xcodeproj is generated from ios/project.yml (see the note there — the
  # pbxproj is deliberately not committed), so xcodegen runs first. The spec
  # writes a shared `Ultimate` scheme; without it xcodebuild would fall back to
  # an implicit scheme with no buildables and reject every destination.
  ios-build:
    name: iOS app (simulator build)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: >
          xcodebuild
          -project Ultimate.xcodeproj
          -scheme Ultimate
          -destination 'generic/platform=iOS Simulator'
          -configuration Release
          build
          CODE_SIGNING_ALLOWED=NO

  # The touch tests. **This is the only job that verifies the game the way a person plays
  # it.**
  #
  # Everything else in this file checks that the simulation computes the right numbers. This
  # runs the app on a booted simulator and drives real UIKit gestures at it — a drag that
  # throws, a held drag that is graded, a tap that sends a cutter, a tap that sends a
  # defender, a drag that comes home and aborts — and asserts on what the HUD says and what
  # the match's own input tape records. See ios/UltimateUITests for what each one drives and
  # for the two things XCUITest turned out not to be able to do.
  #
  # It is a separate job rather than a step on `ios-build` because it needs a *booted*
  # simulator and several minutes of match time, while the build job needs neither and should
  # stay the fast signal.
  #
  # **The destination is chosen by runtime, not by name.** `name=iPhone 17 Pro` is a local
  # fact: macos-15 runners ship an older Xcode with an older device set, and a name that does
  # not exist there fails the whole job with "Unable to find a device matching the provided
  # destination specifier" — which reads as a broken test suite rather than as a missing
  # simulator. `platform=iOS Simulator,OS=latest,name=iPhone 16 Pro` would have the same
  # problem one Xcode later, so the runner is asked to pick: `xcodebuild` resolves
  # `id=` from `simctl list` below, which is the only spelling that cannot go stale.
  ui-tests:
    name: Touch tests (XCUITest)
    runs-on: macos-15
    # A UI test spends most of its time waiting for the match to reach a state where the
    # control under test is legal — measured, a possession changes hands about every ten
    # seconds — so the suite is minutes rather than seconds.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Any available iPhone, whichever runtime this runner happens to have. Printed as well
      # as captured, because "which simulator did CI actually use" is the first question
      # about a UI test failure that reproduces nowhere else.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for rt in sorted(d) if 'iOS' in rt for x in d[rt] if x['name'].startswith('iPhone')))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "using $udid"

      - name: Run the touch tests
        working-directory: ios
        run: >
          xcodebuild test
          -project Ultimate.xcodeproj
          -scheme UltimateUITests
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}'
          CODE_SIGNING_ALLOWED=NO

      # **And again on the rectangle a player actually gets.** A debug build wraps the match in
      # the instruments `TabView`, which leaves the game 750 × 338 at (62, 0) of an 874 × 402
      # window on an iPhone 17 Pro; a release build is the match and nothing else. So the step
      # above exercises a layout that ships to nobody, and a tap fraction that means one thing
      # there means another thing here — see `.agents/friction-log/20260810-the-pitch-is-not-the-window`.
      #
      # `RefusalTests` rather than the whole suite, because it is the one that is *about* the
      # geometry: `testThePitchIsTheRectangleTheTapsAssume` asserts the pitch is the whole window
      # in this configuration, and the other four drive real taps through the release layout to
      # prove the refusal plates are visible on it. The rest of the suite is about gestures whose
      # geometry is relative, and doubling ten minutes of match time to re-run them would buy
      # very little.
      - name: Run the refusal tests against the release layout
        working-directory: ios
        run: >
          xcodebuild test
          -project Ultimate.xcodeproj
          -scheme UltimateUITests
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}'
          -configuration Release
          -only-testing:UltimateUITests/RefusalTests
          CODE_SIGNING_ALLOWED=NO

      # The gestures, the probe readings and the failure screenshots, which are the only way
      # to tell a real regression from a simulator that never booted.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
