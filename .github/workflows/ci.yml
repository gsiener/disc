name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly canary for the two jobs that no longer run on every pull request push (see
    # their `if:` below) — so a regression that only the Swift differential suite or the
    # touch tests would catch is still found within a day, not only at the next merge to
    # `main`. 03:00 UTC: outside US and EU working hours, so a failure is triaged fresh
    # rather than at the end of someone's day.
    - cron: '0 3 * * *'

permissions:
  contents: read

# Supersede in-flight runs on a pull request, where only the tip matters — but
# never on `main`, where every commit is already merged and each one deserves its
# own verdict.
#
# It used to cancel on `main` too, and that is worse than it sounds in a repo
# several agents push to. A broken commit followed a minute later by a good one
# has its run cancelled and is never reported, so `main` looks green at a commit
# that does not build — which is precisely how a broken `main` went unnoticed
# here. It also mis-notifies: GitHub renders a cancelled run as
# "CI: All jobs have failed", so every rapid second push raises a false alarm.
# The group does the work, not `cancel-in-progress`. On a pull request the key is the ref,
# so a new push supersedes the old run. On `main` the key is the commit, so every commit gets
# its own group and nothing can ever be superseded.
#
# A manual re-run keys on the run rather than the commit, so re-running the workflow at a
# commit cannot cancel that commit's in-flight push run — which would be this rule failing by
# a second route.
#
# See docs/adr/0005, which records the spelling this replaced and why it did not work.
concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && github.ref
    || github.event_name == 'push' && github.sha
    || github.run_id }}
  cancel-in-progress: true

jobs:
  # Parse every .ts under src/ with vite's own parser. Two tenths of a second on
  # an ubuntu runner, against 30 minutes of macos-15 for everything below it.
  #
  # It exists for one defect: a backtick inside a GLSL comment closes the shader
  # template literal, `tsc` answers with a hundred-odd errors at lines that are
  # not the fault, and the friction log has it six times — every time from an
  # agent who had already read the entry warning about it. A warning cannot
  # compete with a parser, and this repository has a parser.
  #
  # ubuntu-latest, and not a step bolted onto a macos job: it needs no Xcode, no
  # simulator and no cache, so it is the cheapest verdict in the file and the
  # first one to come back. No `continue-on-error` — see ADR-0005's companion
  # rule, a masked job is worse than a red one.
  syntax-gate:
    name: Syntax gate (src/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Parse src/
        run: npm run gate

      - name: ADR-0008 — the reference does not import the client
        run: npm run reference:imports

      - name: ADR-0004 — a field question cannot be asked without a field
        run: npm run reference:structure

      - name: Reachability — every public UltimateSim func has a caller outside SimChecks
        run: npm run reference:reachability

  # **The layering `Package.swift` describes, as an assertion.**
  #
  # `Package.swift` says `UltimateSim` "imports nothing from Metal, RealityKit, SwiftUI or
  # UIKit, and it never will", and that `ProbeContract` "must not import SwiftUI, RealityKit,
  # UIKit, or UltimateSim". Both were prose, and prose does not fail. `tools/test-imports.ts`
  # exists because the same sentence about the TypeScript reference went unenforced for 68
  # commits while a render dependency crept in behind an import — that job dies with #58, and
  # this is the half of it that should outlive the reference, because it guards the product.
  #
  # An allowlist rather than a denylist. A denylist only catches the frameworks somebody
  # thought to name; the whole failure is a dependency nobody predicted. Widening the list is
  # a deliberate edit in a reviewable diff, which is exactly the conversation worth having.
  #
  # ubuntu-latest and no toolchain: this is grep over ~30k lines, so it returns in seconds and
  # costs nothing next to the macOS jobs below.
  layering:
    name: Target layering (imports)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: UltimateSim depends on nothing but the standard library
        run: |
          set -euo pipefail
          bad=$(grep -rhoE '^import [A-Za-z_]+' swift/Sources/UltimateSim/ \
                | sort -u | grep -vxE 'import (Foundation)' || true)
          if [ -n "$bad" ]; then
            echo "UltimateSim imports something outside its allowlist:"
            echo "$bad"
            echo
            echo "The simulation is a plain library with no platform dependency: the renderer"
            echo "depends on it, it never depends on the renderer. That is what keeps a"
            echo "renderer swap cheap. If this dependency is genuinely wanted, widen the"
            echo "allowlist in this job in the same commit and say why."
            exit 1
          fi
          echo "UltimateSim: Foundation only."

      - name: ProbeContract stays dependency-free
        run: |
          set -euo pipefail
          bad=$(grep -rhoE '^import [A-Za-z_]+' swift/Sources/ProbeContract/ \
                | sort -u | grep -vxE 'import (Foundation|CoreGraphics)' || true)
          if [ -n "$bad" ]; then
            echo "ProbeContract imports something outside its allowlist:"
            echo "$bad"
            echo
            echo "It is the launch and probe contract shared by both sides of the process"
            echo "boundary (issue #21); importing UltimateSim or a UI framework would make it"
            echo "a dependency rather than a contract."
            exit 1
          fi
          echo "ProbeContract: Foundation and CoreGraphics only."

  # `tsc --noEmit` over the whole tree. Clean at the time of writing, and nothing ran it
  # (#15) — so a type error could reach `main` and only be found by whoever next typed the
  # command locally.
  #
  # Its own job rather than two more steps on `syntax-gate`, because that job's whole
  # argument is being the cheapest verdict in the file and the first one back — a fifth of
  # a second against thirty minutes of macos. `tsc` is tens of seconds, which is nothing
  # next to the Swift suite and is a 100× regression for the gate. Separate jobs run in
  # parallel, so the fast verdict stays fast and this costs no wall-clock.
  #
  # Note the two are not redundant, and the order matters when both fail: `npm run gate`
  # parses, and it exists because a backtick inside a GLSL comment closes the shader
  # template literal and makes `tsc` report a hundred errors at lines that are not the
  # fault. So when both are red, believe the gate and ignore this job until it is green.
  #
  # **Two steps, not one.** `tsconfig.json` has `include: ["src"]`, so `tsc --noEmit`
  # silently skips every file under `tools/` — the golden generator, the freshness checker,
  # and every focused test harness. A separate `tsconfig.tools.json` with `include: ["tools"]`
  # closes that gap without widening the src gate's include set, which would slow it by
  # pulling in the gameplay suites. The two checks run as sequential steps in one job
  # because both are `tsc` and cost tens of seconds, and the second step is free if the
  # first already found the fault (the job fails on the first red step).
  typecheck:
    name: Types (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck src/
        run: npm run check

      - name: Typecheck tools/
        run: npm run check:tools

  # Regenerate a golden and diff it. The cardinal rule of this repository is that
  # `src/sim/` is the oracle and the fixtures are its output (ADR-0001), and until now
  # nothing executable enforced it: a change to the reference with no regeneration
  # leaves a stale fixture that is green in both engines at once (#15).
  #
  # ---------------------------------------------------- why one family byte-compared *here*
  #
  # This job byte-compares `rng` and nothing else, and that is a deliberate scope, not an
  # oversight — so it is stated here rather than left to be discovered. The families it
  # cannot compare are not ignored: `goldens-canonical` below compares them on the one
  # platform where a comparison means something, and the staleness step in this job says
  # what a foreign runner *can* say about them.
  #
  # A golden regenerated at the commit that wrote it does not reproduce on a different
  # machine (#41). `coeffs.json` differs in 4 of 2,297 numbers across platforms — one or
  # two ULP of V8 arithmetic — and `matchdiff.json` moves **35 % of its counts**, because
  # eleven fifteen-minute matches are ~108,000 chaotic ticks apiece and one ULP anywhere
  # is enough. A freshness gate over those families would fail for reasons that have
  # nothing to do with freshness, and its failure would look exactly like a real
  # behaviour change. That is a gate that gets turned off within a week.
  #
  # `rng` is the family that cannot drift: xorshift128 is integer and bitwise operations
  # plus one division by 2^32, all of which IEEE 754 specifies exactly. No `pow`, `exp`,
  # `log` or trig anywhere in its call graph, so no libm, so no platform dependence.
  # It is also the anchor the whole port rests on — the header of `gen-goldens.ts` says
  # divergence there "means a structural porting bug rather than numeric drift".
  #
  # Widen this list only with evidence that the family reproduces across machines, and
  # record that evidence in `tools/goldens/families.ts` — which is where the two
  # classifications now live as data, because this comment and `gen-goldens.ts`'s docstring
  # used to be the only record and a workflow comment cannot refuse to run a comparison.
  # `check-goldens.ts freshness` reads that file and exits *before* regenerating if a
  # family is not measured as reproducible on the platform it is standing on.
  #
  # The other eighteen families are covered instead by `Goldens/provenance.json`, which
  # records the Node version, platform and commit that produced each one, so an agent about
  # to regenerate on the wrong machine can see it.
  #
  # `provenance.json` is deliberately NOT diffed: it records the commit, so it changes on
  # every regeneration by design. `check-goldens.ts` scopes its `git diff` to the fixtures
  # it was asked about, so the sidecar it just rewrote cannot fail the job.
  #
  # -------------------------------------------------------------- why ubuntu, not macos
  #
  # The committed fixtures are attributed to darwin/arm64. Running the check on a
  # *different* platform is therefore the stronger test for this family: it asserts
  # freshness and, incidentally, that `rng` really is platform-independent rather than
  # merely agreeing with itself. It is also a tenth of the price of a macos runner.
  #
  # The comment this replaced said the job must *move* to macos the moment the list widens.
  # That was the wrong shape: it would have given up the cross-platform evidence `rng`
  # provides here in order to gain a comparison for `coeffs`. Two jobs, one per platform
  # class, keep both — see `goldens-canonical` below.
  goldens-fresh:
    name: Goldens are fresh (rng) and staleness is reported
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The staleness step compares the commit `provenance.json` records against what has
          # touched `src/sim` since, which the default depth-1 checkout cannot answer — it
          # would report `history-unavailable` for every family and prove nothing.
          fetch-depth: 0

      # The version the committed fixtures are attributed to, pinned in-repo rather
      # than only here, so a developer regenerating locally uses the same one.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Regenerate, byte-compare, and — on a stale fixture — name the file, the exact command
      # that fixes it, and ADR-0001's prohibition on hand-editing. This used to be an inline
      # `git diff` and an `echo`, which meant the one message an agent reads at the moment they
      # are about to hand-edit a golden existed only inside a workflow nobody can run locally.
      #
      # It is also safe to run in a shared checkout, which matters more locally than here: a
      # passing check hands `provenance.json` back byte-identical rather than leaving its own
      # regeneration behind for whoever commits next.
      - name: rng is fresh (regenerate and byte-compare)
        run: node --experimental-strip-types tools/check-goldens.ts freshness rng

      # What a foreign runner can honestly say about `coeffs` and `matchdiff`: provenance and
      # history, never bytes. `--strict` fails only on the two kinds that cannot be a false
      # positive — a fixture attributed to a platform other than darwin/arm64, or one generated
      # from a dirty `src/sim`. History staleness is a warning annotation, because a commit
      # touching `src/sim` need not touch a given family, and the friction log records a fixture
      # reported stale by `git log` while being byte-current.
      - name: Platform-sensitive families report staleness, not byte diffs
        run: node --experimental-strip-types tools/check-goldens.ts staleness --strict

      # The generator's own contract, as assertions: named runs write only what they name, an
      # unknown name writes nothing, provenance is a deterministic sidecar with no wall clock,
      # dirt is `src/sim` dirt, and the refusal paths above actually refuse. Runs in its own
      # throwaway git worktree, so it needs the full history fetched above.
      - name: The golden tooling's own contract
        run: npm run reference:goldens:test

  # The byte comparison the job above cannot make, on the one platform where it means
  # something.
  #
  # `coeffs` and `matchdiff` reach `pow`/`exp`/`log`/trig, and both were *measured* to move
  # across platforms: `coeffs` by 4 of 2,297 numbers, `matchdiff` by 35 % of its counts
  # (`tools/goldens/families.ts` carries both measurements). Comparing them on ubuntu would
  # fail for a reason that is not staleness, and `check-goldens.ts` refuses to try. Comparing
  # them *here* is the missing half of #41: without it, "the fixtures are the oracle's output"
  # is enforced for one family out of nineteen, and `matchdiff.json` sat stale across two
  # `src/sim` behaviour changes with nothing to say so.
  #
  # **macos-15 is arm64**, which is what makes it the canonical runner and not merely a mac.
  # The check asserts that rather than assuming it: if a future runner image is x86_64, the
  # step refuses instead of quietly comparing bytes that were never going to match.
  #
  # ------------------------------------------------------------------- the cost, honestly
  #
  # `matchdiff` is eleven fifteen-minute matches — ~2m55s of node on an M-series laptop, and
  # a macos runner is slower. It runs on pull requests anyway, unlike `sim-tests`: a gate that
  # only runs after merge cannot stop a stale fixture from being merged, which is the whole
  # failure this closes. If it becomes the wall clock a push waits on, shard it by family
  # before reaching for an `if:` — a skipped freshness gate is indistinguishable from a
  # missing one.
  #
  # One thing that can turn this red without anybody changing the reference: a Node minor
  # bump. `.nvmrc` now pins the exact version `provenance.json` records (v26.7.0) rather
  # than the major alone, so `setup-node` resolves the same Node that produced the committed
  # fixtures — and a V8 update cannot move a libm-sensitive number by a ULP without a
  # deliberate version bump in `.nvmrc`. If that bump does move a number, it is not a false
  # alarm: it is the fixture genuinely no longer being what this toolchain produces, and the
  # fix is the one the failure prints — regenerate on the canonical platform and commit the
  # diff. The exact pin is the decision: the major-only pin was sufficient for detection (the
  # canonical job catches any drift), but not for reproducibility (a developer who checks out
  # the repo and regenerates locally would get a different Node than CI did). Pinning to the
  # version `provenance.json` records closes that gap. The runner platform step below prints
  # `process.version` so a version mismatch is the first thing a reader sees, not the last.
  goldens-canonical:
    name: Goldens are fresh on the canonical platform (coeffs, matchdiff)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Printed rather than inferred: "which platform did CI actually regenerate on" is the
      # first question about a golden that reproduces nowhere else, and this file has already
      # learned once that a configuration you cannot read back is a configuration you do not
      # have (see `TEST_RUNNER_UITEST_SLOWDOWN` on the touch job).
      - name: Runner platform
        run: |
          set -euo pipefail
          uname -sm
          node -p "process.platform + '/' + process.arch"
          node -p "process.version"

      - name: coeffs and matchdiff are fresh (regenerate and byte-compare on darwin/arm64)
        run: node --experimental-strip-types tools/check-goldens.ts freshness coeffs matchdiff

  # The differential suite: SimChecks loads the JSON goldens bundled as package
  # resources and replays ~2.2M assertions against the ported model. It prints a
  # PASS line with the assertion count and exits nonzero on any failure, so a
  # plain `swift run` is the whole test harness.
  #
  # macos-15 ships Xcode 16.x, which is the floor for swift-tools-version 6.0
  # (Package.swift).
  sim-tests:
    name: Swift differential suite (SimTests)
    runs-on: macos-15
    # **This runs on pull requests, and the note that used to sit here explaining why it did
    # not was wrong.** It said the suite still runs on every push to `main`, so "nothing
    # merges unverified" — but a push to `main` *is* the merge. Verification landed strictly
    # after the fact, and a red result meant reverting rather than not merging.
    #
    # What that cost, measured on the pull request that fixed #59: it changed thirteen Swift
    # files, added a fourteenth and rewrote a check suite, and merged on five green checks —
    # four of which were TypeScript jobs (`syntax-gate`, `typecheck`, and both golden
    # freshness gates) testing the reference that #58 is deleting. Not one Swift assertion
    # ran. The ~5m45s this saves is not worth a merge gate that cannot see the product.
    # Generous: release-mode build plus ~2.2M assertions.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # **A cache of build products is only as good as the timestamps the build system trusts,
      # and `actions/checkout` hands every file the checkout's own mtime.** SwiftPM's
      # incremental build compares a source file's mtime against what it recorded when it last
      # compiled that file — so even a byte-identical cache hit below looks, to the build
      # system, like every source changed a moment ago and needs recompiling. Setting each
      # tracked file's mtime back to its last commit's time is what a hit actually has to mean
      # for the cache to do anything; see the Xcode jobs below, which had the same bug and no
      # fix for it until this was found (`.agents/friction-log` — the reverted DerivedData cache
      # attempt is what surfaced it).
      #
      # One `git log` per file rather than one pass over history, because this repo's history is
      # small enough that the simplicity is worth more than the constant-factor speedup — and
      # this only needs to run over the ~30k lines that feed the build, not the whole tree.
      - name: Restore source mtimes from git history
        run: |
          set -euo pipefail
          git ls-files -z swift | while IFS= read -r -d '' f; do
            touch -t "$(git log -1 --date='format:%Y%m%d%H%M.%S' --format=%cd -- "$f")" "$f"
          done

      - name: Swift version
        run: swift --version

      # **The cache is of build products, not of dependencies, and that distinction is the
      # whole point.** This job used to carry a note saying no cache was needed because the
      # package has zero external dependencies and no `Package.resolved` — which is true of
      # *dependencies* and irrelevant to the thing that actually costs time. What takes 72.9 s
      # locally from cold (48 s incremental) is compiling this package's own ~30k lines of
      # Swift in release mode, and a runner does it from scratch every single run.
      #
      # Keyed on the sources, so any change to them is a miss and a full rebuild — this can
      # make a run slower to start but never wrong. `restore-keys` lets a near-miss start from
      # the previous build state and recompile only what moved, which is the common case.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: swift/.build
          key: spm-release-${{ runner.os }}-${{ hashFiles('swift/Package.swift', 'swift/Sources/**/*.swift') }}
          restore-keys: |
            spm-release-${{ runner.os }}-

      # **Compiling is a separate step from testing, for the reason ADR-0006 records and the
      # touch job already applies.** As one `swift run`, a compile error was reported by the
      # step that reports the test verdict — so a build failure read as a test failure, and
      # the timing table nobody had until this was split was impossible to produce. Now a
      # compile error is red here with the compiler's own message, and the step below reports
      # only what the assertions did.
      - name: Build SimTests
        working-directory: swift
        run: swift build -c release --product SimTests

      # `.build/release/SimTests` rather than `swift run`, which would re-enter the build
      # system and quietly reintroduce exactly what the split above separated.
      - name: Run the differential suite
        working-directory: swift
        run: .build/release/SimTests

  # **The same seed must play the same match in every build configuration**, and no suite
  # running inside a single build can check that — by construction, the bug is the
  # difference between two builds.
  #
  # This exists because it happened. LLVM's `SimplifyLibCalls` pass fuses a neighbouring
  # `sin(x)` / `cos(x)` on the same argument into Darwin's `__sincos_stret`, whose sine
  # differs from `sin` by an ulp; the pass runs at `-O` and not at `-Onone`. One ulp in a
  # marker's bearing became a different possession by the end of the match, `stoppage` ran
  # five fewer assertions in debug than release, and the release-only CI above was green
  # through all of it. `UltimateSim/SinCos.swift` is the fix; this job is what keeps it
  # fixed, and it would catch the next transform of the same shape without knowing anything
  # about `sincos`.
  #
  # `engine` and `stoppage` are the two suites that simulate whole matches, which is what it
  # takes to amplify an ulp into an observable difference — the bit-exact component suites
  # agreed with each other throughout. Running only those two keeps the debug half (~6x
  # slower than release) to about nine minutes instead of forty.
  # Runs on pull requests for the same reason `sim-tests` does, and with one of its own: the
  # pull request most likely to reintroduce this is the one that adds a `sin` or a `cos`, and
  # a gate that only fires after the merge tells you about it in a revert rather than a review.
  cross-config:
    name: Debug and release play the same match
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # See `sim-tests` above for why this is here — checkout mtimes defeat the cache.
      - name: Restore source mtimes from git history
        run: |
          set -euo pipefail
          git ls-files -z swift | while IFS= read -r -d '' f; do
            touch -t "$(git log -1 --date='format:%Y%m%d%H%M.%S' --format=%cd -- "$f")" "$f"
          done

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: swift/.build
          key: spm-crossconfig-${{ runner.os }}-${{ hashFiles('swift/Package.swift', 'swift/Sources/**/*.swift') }}
          restore-keys: |
            spm-crossconfig-${{ runner.os }}-

      - name: Build both configurations
        working-directory: swift
        run: |
          set -euo pipefail
          swift build -c debug --product SimTests
          swift build -c release --product SimTests

      # Compared on the per-suite assertion counts the runner already prints. Those counts are
      # data-dependent — `stoppage` emits one assertion per timeout that resumed a live
      # possession — so a match that plays differently reports a different number, which is
      # precisely the signal wanted.
      - name: The two configurations agree
        working-directory: swift
        run: |
          set -euo pipefail
          .build/debug/SimTests   engine stoppage | grep -E '^  (engine|stoppage) ' \
            | awk '{print $1, $2}' > /tmp/debug.counts
          .build/release/SimTests engine stoppage | grep -E '^  (engine|stoppage) ' \
            | awk '{print $1, $2}' > /tmp/release.counts
          echo "debug:";   cat /tmp/debug.counts
          echo "release:"; cat /tmp/release.counts
          if ! diff -u /tmp/debug.counts /tmp/release.counts; then
            echo
            echo "Debug and release played different matches from the same seed."
            echo "See swift/Sources/UltimateSim/SinCos.swift — every sin and cos in the"
            echo "simulation must go through simSin/simCos, or the optimiser substitutes"
            echo "a different libm routine in one configuration and not the other."
            exit 1
          fi

  # The iOS app, built for the simulator so no signing identity is needed.
  # The .xcodeproj is generated from ios/project.yml (see the note there — the
  # pbxproj is deliberately not committed), so xcodegen runs first. The spec
  # writes a shared `Ultimate` scheme; without it xcodebuild would fall back to
  # an implicit scheme with no buildables and reject every destination.
  ios-build:
    name: iOS app (simulator build)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # See the identical step on `sim-tests` above — same bug (checkout mtimes defeat
      # incremental builds), same fix, applied here to the app + UltimateSim package instead
      # of just the package.
      - name: Restore source mtimes from git history
        run: |
          set -euo pipefail
          git ls-files -z ios swift | while IFS= read -r -d '' f; do
            touch -t "$(git log -1 --date='format:%Y%m%d%H%M.%S' --format=%cd -- "$f")" "$f"
          done

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Same pattern as the Swift package's build cache: keyed on the sources that feed this
      # build (the app target plus the UltimateSim package it links). Only does anything now
      # that the step above keeps the build system from seeing every source as freshly changed
      # on a cache hit — see the reverted first attempt at this, which cached without it.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: ios/build
          key: ios-release-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Ultimate/**', 'swift/Package.swift', 'swift/Sources/**/*.swift') }}
          restore-keys: |
            ios-release-${{ runner.os }}-

      - name: Build for iOS Simulator
        working-directory: ios
        run: >
          xcodebuild
          -project Ultimate.xcodeproj
          -scheme Ultimate
          -destination 'generic/platform=iOS Simulator'
          -configuration Release
          -derivedDataPath build
          build
          CODE_SIGNING_ALLOWED=NO

  # The touch tests. **This is the only job that verifies the game the way a person plays
  # it.**
  #
  # Everything else in this file checks that the simulation computes the right numbers. This
  # runs the app on a booted simulator and drives real UIKit gestures at it — a drag that
  # throws, a held drag that is graded, a tap that sends a cutter, a tap that sends a
  # defender, a drag that comes home and aborts — and asserts on what the HUD says and what
  # the match's own input tape records. See ios/UltimateUITests for what each one drives and
  # for the two things XCUITest turned out not to be able to do.
  #
  # It is a separate job rather than a step on `ios-build` because it needs a *booted*
  # simulator and several minutes of match time, while the build job needs neither and should
  # stay the fast signal.
  #
  # **The destination is chosen by runtime, not by name.** `name=iPhone 17 Pro` is a local
  # fact: macos-15 runners ship an older Xcode with an older device set, and a name that does
  # not exist there fails the whole job with "Unable to find a device matching the provided
  # destination specifier" — which reads as a broken test suite rather than as a missing
  # simulator. `platform=iOS Simulator,OS=latest,name=iPhone 16 Pro` would have the same
  # problem one Xcode later, so the runner is asked to pick: `xcodebuild` resolves
  # `id=` from `simctl list` below, which is the only spelling that cannot go stale.
  # Builds the UI test target exactly once. Split out from `ui-tests` below because that job
  # is sharded to run test *execution* in parallel, and a naive shard-the-whole-job split (the
  # first attempt at this) pays the ~220-310 s `build-for-testing` compile again in every
  # shard — duplicated work that made two shards measure *slower* than one unsharded job
  # (9m47s vs the 8m46s baseline, run 31592896055). Building once and handing the compiled
  # product to each shard is the fix: the compile is paid for here, a single time, and each
  # shard downstream only has to run its slice of the tests.
  ui-tests-build:
    name: Touch tests (build for testing)
    runs-on: macos-15
    if: github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # See `sim-tests` / `ios-build` above for why this exists: `actions/checkout` stamps
      # every file with the checkout's own mtime, and Xcode's incremental build keys off
      # mtimes, so a cache hit below still looked like a full source change until this ran.
      - name: Restore source mtimes from git history
        run: |
          set -euo pipefail
          git ls-files -z ios swift | while IFS= read -r -d '' f; do
            touch -t "$(git log -1 --date='format:%Y%m%d%H%M.%S' --format=%cd -- "$f")" "$f"
          done

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Debug-config counterpart of `ios-build`'s release cache: same sources plus the UI
      # test target itself, since that's what `build-for-testing` actually compiles here.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: ios/build
          key: ios-uitests-debug-${{ runner.os }}-${{ hashFiles('ios/project.yml', 'ios/Ultimate/**', 'ios/UltimateUITests/**', 'swift/Package.swift', 'swift/Sources/**/*.swift') }}
          restore-keys: |
            ios-uitests-debug-${{ runner.os }}-

      # A concrete destination rather than `generic/platform=iOS Simulator`: a generic
      # destination has no single "active" architecture to build for and produces a fat
      # arm64+x86_64 binary — roughly double the compile for a slice that never runs, since
      # every simulator this runner can boot is arm64. Which concrete simulator is picked
      # doesn't matter — the shards below boot their own and any arm64 simulator can run an
      # arm64-built `.xctest` bundle — so this only exists to pin the architecture.
      - name: Pick a simulator to build against
        id: sim
        run: |
          set -euo pipefail
          read -r udid _ < <(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];rt,x=next((rt,x) for rt in sorted(d) if 'iOS' in rt for x in d[rt] if x['name'].startswith('iPhone'));print(x['udid'],x['name'])")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        working-directory: ios
        run: >
          xcodebuild build-for-testing
          -project Ultimate.xcodeproj
          -scheme UltimateUITests
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      # Everything a shard needs to run tests without rebuilding: the app, the test bundle,
      # and the `.xctestrun` `build-for-testing` writes describing how to run them. Nothing
      # under `Intermediates.noindex` — those are compiler scratch files a shard never reads.
      - name: Upload build products
        uses: actions/upload-artifact@v4
        with:
          name: ui-tests-build-products
          path: ios/build/Build/Products
          retention-days: 1
          if-no-files-found: error

  # The touch tests. **This is the only job that verifies the game the way a person plays
  # it.**
  #
  # Everything else in this file checks that the simulation computes the right numbers. This
  # runs the app on a booted simulator and drives real UIKit gestures at it — a drag that
  # throws, a held drag that is graded, a tap that sends a cutter, a tap that sends a
  # defender, a drag that comes home and aborts — and asserts on what the HUD says and what
  # the match's own input tape records. See ios/UltimateUITests for what each one drives and
  # for the two things XCUITest turned out not to be able to do.
  #
  # It is a separate job rather than a step on `ios-build` because it needs a *booted*
  # simulator and several minutes of match time, while the build job needs neither and should
  # stay the fast signal.
  ui-tests:
    name: Touch tests (XCUITest, ${{ matrix.shard.name }})
    needs: ui-tests-build
    runs-on: macos-15
    if: github.event_name != 'pull_request'
    # Two shards, not eleven, split by class rather than by individual test name so that a
    # test added later lands in a shard automatically instead of silently running in neither.
    #
    # The two groups are balanced on one measured run (31552114426): ChargeTests at ~95 s,
    # RefusalTests + TouchTests at ~115 s — both dominated by the two tests that retry a
    # possession on an unlucky pull (`testAimingAtTheWindowGetsACleanRelease`,
    # `testTheOffensiveTapUsuallyMeansSomething`; see `MatchDriver.withTheDisc`), so the actual
    # split on any given run has real variance around this balance point.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: charge
            only: -only-testing:UltimateUITests/ChargeTests
          - name: refusal-touch
            only: >-
              -only-testing:UltimateUITests/RefusalTests
              -only-testing:UltimateUITests/TouchTests
    # **The waiting is the story of this job and it has been cut, not padded.**
    #
    # A UI test used to spend nearly all of its time waiting for the match to hand the human's
    # team a possession, which with no input happens about **once per point cycle** — because
    # `Engine.init` gave the opening pull to team 0, so team 0 received nothing. Measured
    # headlessly: 25-64 s to the first window and 38-96 s between windows, against waits of
    # 90 s. Eleven tests took 664 s and passed on margin.
    #
    # `-receive us` flips the coin toss (`EngineConfig.startingPullTeam`) so the disc arrives
    # with the pull, seconds after launch. Nothing about the gestures or the assertions changed
    # — see ios/UltimateUITests, where each test now names which side of the toss it needs and
    # why. The waits came down with it; `MatchDriver` carries the durations and the
    # measurements. Note `samplingCap` among them — at 60 × the slowdown it is the largest
    # single budget in this job, and the one to look at before shortening `timeout-minutes`.
    #
    # This stays generous against a cold runner and a simulator boot. It no longer needs to
    # cover a `brew install` or the `build-for-testing` compile — those moved to
    # `ui-tests-build` — so it is shorter than the job it replaced.
    timeout-minutes: 15
    steps:
      # No checkout: this job only runs a prebuilt `.xctestrun`, and nothing here reads a
      # source file. `Pick a simulator` and `simctl` come from the runner image, not the repo.
      - name: Download build products
        uses: actions/download-artifact@v4
        with:
          name: ui-tests-build-products
          path: ios/build/Build/Products

      # Any available iPhone, whichever runtime this runner happens to have. Printed as well
      # as captured, because "which simulator did CI actually use" is the first question
      # about a UI test failure that reproduces nowhere else. This runner's simulator need not
      # be — and generally isn't — the same instance `ui-tests-build` picked; only the
      # architecture had to match, and every simulator here is arm64.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          read -r udid name runtime < <(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];rt,x=next((rt,x) for rt in sorted(d) if 'iOS' in rt for x in d[rt] if x['name'].startswith('iPhone'));print(x['udid'],x['name'].replace(' ','_'),rt.rsplit('.',1)[-1])")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Name and runtime, not just the udid. A udid identifies a run; it does not say what
          # geometry that run got, and "which device produced this pitch rectangle" is a
          # question a udid alone cannot answer (issue #13). The touch tests print the same
          # three facts next to the rectangle itself.
          echo "using ${name//_/ } — $runtime — $udid"

      # **Boot it here, deliberately, and wait for it.**
      #
      # `xcodebuild test` will boot a shut-down simulator by itself, which sounds like one
      # less step until it fails: the first boot lands *inside* the first test, so its cost
      # is charged to that test's timeout and its failure is reported as that test failing.
      # A run on 2026-08-10 spent 84 s in `app.launch()` and reported
      # "Application does not have a process ID" — which reads as a crash in the app and was
      # a simulator that had not finished coming up. Another died with "Early unexpected
      # exit, operation never finished bootstrapping" before a single test ran, and the run
      # summary was indistinguishable from eleven honest failures.
      #
      # `bootstatus -b` blocks until the device reports itself booted, so a boot that does
      # not happen fails *as a boot* in a step named for it. See issue #14.
      - name: Start the simulator booting
        run: xcrun simctl boot '${{ steps.sim.outputs.udid }}' || true

      # The other half of the boot above: confirm it finished. Blocking, and the device is
      # printed because "which simulator did CI actually use" is the first question about a
      # UI test failure that reproduces nowhere else.
      - name: Wait for the simulator
        run: |
          set -euo pipefail
          if ! xcrun simctl bootstatus '${{ steps.sim.outputs.udid }}' -b; then
            echo "BOOT FAILURE: simulator ${{ steps.sim.outputs.udid }} did not finish booting (simctl bootstatus failed)"
            exit 1
          fi
          xcrun simctl list devices | grep -F '${{ steps.sim.outputs.udid }}'

      # **There used to be a `Warm the app` step here and deleting it is the fix, not a
      # regression.** It installed the app, launched it, slept 20 s and killed it, so that the
      # first `app.launch()` a test made was not also paying for a cold first install.
      #
      # `MatchDriver.init` already does all of that and does it better: it installs, launches,
      # and then *waits on the probe* — a condition — on the `patience` budget, which is sized
      # for exactly this. The step contributed an unconditional 20 s whether the app reached a
      # frame in three seconds or never launched at all, and being `continue-on-error` it could
      # not report that it had bought nothing. It had also drifted: it warmed
      # `-setup off -probe on`, missing the `-receive` and `-points` the tests actually launch
      # with, so the run it warmed was not the run that followed.
      #
      # Compare `Start the simulator booting` / `Wait for the simulator` above, which is the
      # same problem solved at the right depth: block on the condition, not on a number.

      # **Blocking, and it was briefly not — which was a mistake worth recording.**
      #
      # The first CI run of these tests failed with the probe never appearing after
      # `Unable to monitor event loop` at t=6.81 s: a software renderer trying to draw a
      # RealityKit scene stepping a match at 120 Hz. That is answered by `UITEST_SLOWDOWN`
      # below — every wait in the suite is a multiple of it — and not by a 90 s constant,
      # which turned out to reach only the waits that took `wait`'s default and left the
      # tests' own `timeout: 10` and `timeout: 5` literals running at a laptop's budget.
      # Two tests died on exactly those two literals in run 31384063453.
      #
      # The mistake was also adding `continue-on-error: true` at the same time. The next
      # run went green — and the tests had not run at all, because the suite no longer
      # *compiled*: a stale file had reverted another change's additions. A masked job
      # reports success for a compile error, which is strictly worse than a red job,
      # because a red job gets fixed and a green lie does not. If the runner turns out
      # to be genuinely too slow even at the multiplier set below, the answer is to say so here
      # and skip the job deliberately — not to let it pass while failing.
      #
      # There is no `continue-on-error` step left in this job at all: the one that had it,
      # `Warm the app`, was deleted rather than kept as an exception. See the note where it
      # used to be.
      #
      # **`UITEST_SLOWDOWN` is the one timing knob**, and it is set here rather than sniffed.
      #
      # It used to be `CI: "true"`, read by `MatchDriver.patience`, and that was wrong twice
      # over. It was *invisible* to the `wait(timeout: 10)` and `wait(timeout: 5)` literals in
      # the tests, so a run on this software renderer lost two tests to a developer machine's
      # budget while the job looked configured for a slow one. And `CI` is a variable a dozen
      # local tools export for their own reasons, so a developer who happened to have it set
      # ran the whole suite at CI's generous budget and could not have seen a regression that
      # a tight local run fails on. A name nothing else uses, carrying the number rather than
      # a boolean, fixes both: every wait in the suite is a multiple of it, and the multiplier
      # is reviewable here.
      #
      # **`TEST_RUNNER_` prefix, and without it none of the above was true.**
      #
      # `xcodebuild` does not forward the host environment into the test process, which runs in
      # the simulator. Set as a bare `UITEST_SLOWDOWN`, the variable reached `xcodebuild` and
      # stopped there: `MatchDriver.slowdown` read nothing, fell back to its clamp, and every
      # run of this job since the knob was introduced has been at **×1**. Run 31396301991 says
      # so in its own log — `UITEST TIMING: slowdown ×1.0` — under a step that sets 4.
      #
      # `TEST_RUNNER_<NAME>` is the documented mechanism: `xcodebuild` strips the prefix and
      # passes the rest to the test runner. Verified locally by reading the announce line back.
      #
      # This is the third spelling of one mistake — `CI: "true"` was invisible to the tests'
      # timeout literals, the literals were invisible to `UITEST_SLOWDOWN`, and
      # `UITEST_SLOWDOWN` was invisible to the simulator. Each time the job looked tuned and
      # was not. `announce()` printing the multiplier is what finally caught it, which is the
      # argument for printing configuration rather than trusting it.
      #
      # **2, and this number now has a measurement behind it.** It was 4, described as measured
      # when nothing had measured it. Comparing the eleven tests at ×1 on this runner against
      # ×1 locally (run 31396301991 vs. a local pass in 135 s):
      #
      #   median ratio 1.17 — worst 3.05 (`testDragBackToTheOrigin`), then 2.37
      #
      # and the two large ones are *retries*, not slower waits: every individual wait was
      # satisfied at ×1, and those tests took longer because `withTheDisc` spent more attempts,
      # each paying a full budget. So the waits need roughly 1.2–1.4× and 2 is the headroom.
      #
      # **The multiplier is not free, and the measured price of ×2 is 73 s.** The job ran the
      # eleven tests in 215.8 s at ×1 (run 31396301991) and 288.6 s at ×2 (run 31396728400),
      # both green. The cost is not idle waiting: it is `withTheDisc` retries, where a failed
      # attempt polls for the whole of `possession` before relaunching, so every retry pays the
      # budget in full. That is also why the two worst per-test ratios above are retry counts
      # rather than slowness. ×4 would roughly double that surcharge again for no measured
      # benefit, which is the argument against going back to it.
      #
      # One thing ×2 did *not* change, contradicting a guess made when this was written: the tap
      # sampler returns **11 taps at both multipliers**, so it is not bound by `samplingCap`.
      # `RefusalTests` attempts all twelve; the twelfth is simply not visible in the ledger read
      # that follows it. The floor of 8 is what makes that harmless. Do not raise the cap
      # expecting a twelfth tap — the gap is a probe-read ordering artefact, not a budget.
      #
      # `-xctestrun` rather than `-project`/`-scheme`/`-derivedDataPath`: this job never ran
      # `build-for-testing` and has no `.xcodeproj` (no checkout, no xcodegen) — everything
      # needed to run is inside the downloaded products directory, and the `.xctestrun` is
      # what tells `xcodebuild` where to find it. Located by glob rather than a hardcoded name
      # because the filename embeds the SDK version (`UltimateUITests_iphonesimulatorNN.N-*`),
      # which drifts with the Xcode version the runner image ships.
      - name: Run the touch tests
        env:
          TEST_RUNNER_UITEST_SLOWDOWN: "2"
        run: |
          set -euo pipefail
          xctestrun=$(find ios/build/Build/Products -maxdepth 1 -name '*.xctestrun')
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -resultBundlePath "ios/build/Results-${{ matrix.shard.name }}.xcresult" \
            ${{ matrix.shard.only }}

      # The gestures, the probe readings and the failure screenshots, which are the only way
      # to tell a real regression from a simulator that never booted. Named per shard — two
      # matrix jobs uploading `ui-test-results` would collide.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.shard.name }}
          path: ios/build/Results-${{ matrix.shard.name }}.xcresult
          retention-days: 7
          if-no-files-found: ignore
