name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs on a pull request, where only the tip matters — but
# never on `main`, where every commit is already merged and each one deserves its
# own verdict.
#
# It used to cancel on `main` too, and that is worse than it sounds in a repo
# several agents push to. A broken commit followed a minute later by a good one
# has its run cancelled and is never reported, so `main` looks green at a commit
# that does not build — which is precisely how a broken `main` went unnoticed
# here. It also mis-notifies: GitHub renders a cancelled run as
# "CI: All jobs have failed", so every rapid second push raises a false alarm.
# The group does the work, not `cancel-in-progress`. On a pull request the key is the ref,
# so a new push supersedes the old run. On `main` the key is the commit, so every commit gets
# its own group and nothing can ever be superseded.
#
# A manual re-run keys on the run rather than the commit, so re-running the workflow at a
# commit cannot cancel that commit's in-flight push run — which would be this rule failing by
# a second route.
#
# See docs/adr/0005, which records the spelling this replaced and why it did not work.
concurrency:
  group: >-
    ci-${{ github.event_name == 'pull_request' && github.ref
    || github.event_name == 'push' && github.sha
    || github.run_id }}
  cancel-in-progress: true

jobs:
  # Parse every .ts under src/ with vite's own parser. Two tenths of a second on
  # an ubuntu runner, against 30 minutes of macos-15 for everything below it.
  #
  # It exists for one defect: a backtick inside a GLSL comment closes the shader
  # template literal, `tsc` answers with a hundred-odd errors at lines that are
  # not the fault, and the friction log has it six times — every time from an
  # agent who had already read the entry warning about it. A warning cannot
  # compete with a parser, and this repository has a parser.
  #
  # ubuntu-latest, and not a step bolted onto a macos job: it needs no Xcode, no
  # simulator and no cache, so it is the cheapest verdict in the file and the
  # first one to come back. No `continue-on-error` — see ADR-0005's companion
  # rule, a masked job is worse than a red one.
  syntax-gate:
    name: Syntax gate (src/)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Parse src/
        run: npm run gate

  # The differential suite: SimChecks loads the JSON goldens bundled as package
  # resources and replays ~2.2M assertions against the ported model. It prints a
  # PASS line with the assertion count and exits nonzero on any failure, so a
  # plain `swift run` is the whole test harness.
  #
  # macos-15 ships Xcode 16.x, which is the floor for swift-tools-version 6.0
  # (Package.swift).
  sim-tests:
    name: Swift differential suite (SimTests)
    runs-on: macos-15
    # Generous: release-mode build plus ~2.2M assertions.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # **The cache is of build products, not of dependencies, and that distinction is the
      # whole point.** This job used to carry a note saying no cache was needed because the
      # package has zero external dependencies and no `Package.resolved` — which is true of
      # *dependencies* and irrelevant to the thing that actually costs time. What takes 72.9 s
      # locally from cold (48 s incremental) is compiling this package's own ~30k lines of
      # Swift in release mode, and a runner does it from scratch every single run.
      #
      # Keyed on the sources, so any change to them is a miss and a full rebuild — this can
      # make a run slower to start but never wrong. `restore-keys` lets a near-miss start from
      # the previous build state and recompile only what moved, which is the common case.
      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: swift/.build
          key: spm-release-${{ runner.os }}-${{ hashFiles('swift/Package.swift', 'swift/Sources/**/*.swift') }}
          restore-keys: |
            spm-release-${{ runner.os }}-

      # **Compiling is a separate step from testing, for the reason ADR-0006 records and the
      # touch job already applies.** As one `swift run`, a compile error was reported by the
      # step that reports the test verdict — so a build failure read as a test failure, and
      # the timing table nobody had until this was split was impossible to produce. Now a
      # compile error is red here with the compiler's own message, and the step below reports
      # only what the assertions did.
      - name: Build SimTests
        working-directory: swift
        run: swift build -c release --product SimTests

      # `.build/release/SimTests` rather than `swift run`, which would re-enter the build
      # system and quietly reintroduce exactly what the split above separated.
      - name: Run the differential suite
        working-directory: swift
        run: .build/release/SimTests

  # The iOS app, built for the simulator so no signing identity is needed.
  # The .xcodeproj is generated from ios/project.yml (see the note there — the
  # pbxproj is deliberately not committed), so xcodegen runs first. The spec
  # writes a shared `Ultimate` scheme; without it xcodebuild would fall back to
  # an implicit scheme with no buildables and reject every destination.
  ios-build:
    name: iOS app (simulator build)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for iOS Simulator
        working-directory: ios
        run: >
          xcodebuild
          -project Ultimate.xcodeproj
          -scheme Ultimate
          -destination 'generic/platform=iOS Simulator'
          -configuration Release
          build
          CODE_SIGNING_ALLOWED=NO

  # The touch tests. **This is the only job that verifies the game the way a person plays
  # it.**
  #
  # Everything else in this file checks that the simulation computes the right numbers. This
  # runs the app on a booted simulator and drives real UIKit gestures at it — a drag that
  # throws, a held drag that is graded, a tap that sends a cutter, a tap that sends a
  # defender, a drag that comes home and aborts — and asserts on what the HUD says and what
  # the match's own input tape records. See ios/UltimateUITests for what each one drives and
  # for the two things XCUITest turned out not to be able to do.
  #
  # It is a separate job rather than a step on `ios-build` because it needs a *booted*
  # simulator and several minutes of match time, while the build job needs neither and should
  # stay the fast signal.
  #
  # **The destination is chosen by runtime, not by name.** `name=iPhone 17 Pro` is a local
  # fact: macos-15 runners ship an older Xcode with an older device set, and a name that does
  # not exist there fails the whole job with "Unable to find a device matching the provided
  # destination specifier" — which reads as a broken test suite rather than as a missing
  # simulator. `platform=iOS Simulator,OS=latest,name=iPhone 16 Pro` would have the same
  # problem one Xcode later, so the runner is asked to pick: `xcodebuild` resolves
  # `id=` from `simctl list` below, which is the only spelling that cannot go stale.
  ui-tests:
    name: Touch tests (XCUITest)
    runs-on: macos-15
    # **The waiting is the story of this job and it has been cut, not padded.**
    #
    # A UI test used to spend nearly all of its time waiting for the match to hand the human's
    # team a possession, which with no input happens about **once per point cycle** — because
    # `Engine.init` gave the opening pull to team 0, so team 0 received nothing. Measured
    # headlessly: 25-64 s to the first window and 38-96 s between windows, against waits of
    # 90 s. Eleven tests took 664 s and passed on margin.
    #
    # `-receive us` flips the coin toss (`EngineConfig.startingPullTeam`) so the disc arrives
    # with the pull, seconds after launch. Nothing about the gestures or the assertions changed
    # — see ios/UltimateUITests, where each test now names which side of the toss it needs and
    # why. The waits came down with it; `MatchDriver` carries the durations and the
    # measurements. Note `samplingCap` among them — at 60 × the slowdown it is the largest
    # single budget in this job, and the one to look at before shortening `timeout-minutes`.
    #
    # This stays generous against a cold runner, a brew install and two simulator boots. It is
    # a ceiling on a pathology, not a budget the tests are expected to use.
    #
    # **30 and not 20, because the 664 s measurement above predates three of this job's steps.**
    # It is eleven tests on a warm simulator; it does not include the boot, the
    # `build-for-testing` compile (3m14s measured on this runner) or the xcodegen install. And
    # the cost of getting this wrong is asymmetric: a job killed by `timeout-minutes` skips its
    # remaining steps, so `Upload test results` never runs and the `.xcresult` is lost on
    # precisely the run that needed it — which is the diagnostic `-derivedDataPath` was made
    # explicit to keep.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Any available iPhone, whichever runtime this runner happens to have. Printed as well
      # as captured, because "which simulator did CI actually use" is the first question
      # about a UI test failure that reproduces nowhere else.
      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          read -r udid name runtime < <(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];rt,x=next((rt,x) for rt in sorted(d) if 'iOS' in rt for x in d[rt] if x['name'].startswith('iPhone'));print(x['udid'],x['name'].replace(' ','_'),rt.rsplit('.',1)[-1])")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Name and runtime, not just the udid. A udid identifies a run; it does not say what
          # geometry that run got, and "which device produced this pitch rectangle" is a
          # question a udid alone cannot answer (issue #13). The touch tests print the same
          # three facts next to the rectangle itself.
          echo "using ${name//_/ } — $runtime — $udid"

      # **Boot it here, deliberately, and wait for it.**
      #
      # `xcodebuild test` will boot a shut-down simulator by itself, which sounds like one
      # less step until it fails: the first boot lands *inside* the first test, so its cost
      # is charged to that test's timeout and its failure is reported as that test failing.
      # A run on 2026-08-10 spent 84 s in `app.launch()` and reported
      # "Application does not have a process ID" — which reads as a crash in the app and was
      # a simulator that had not finished coming up. Another died with "Early unexpected
      # exit, operation never finished bootstrapping" before a single test ran, and the run
      # summary was indistinguishable from eleven honest failures.
      #
      # `bootstatus -b` blocks until the device reports itself booted, so a boot that does
      # not happen fails *as a boot* in a step named for it. See issue #14.
      #
      # **Started here and waited for after the compile**, because those are two different
      # things and only one of them is worth blocking on. `simctl boot` returns as soon as the
      # boot is *initiated*; `bootstatus -b` is what waits. `build-for-testing` does not need a
      # booted device, so waiting here would serialise a full boot ahead of a three-minute
      # compile for nothing. Split, the boot happens during the compile and is merely confirmed
      # afterwards — and a boot that never completes still fails in a step named for it, which
      # is the property worth keeping.
      - name: Start the simulator booting
        run: xcrun simctl boot '${{ steps.sim.outputs.udid }}' || true

      # **Compiling is a separate step from testing, and that is the point.**
      #
      # These were one `xcodebuild test` invocation, and it hid a real failure: a stale file
      # broke the suite's compilation, and because the compile happened inside the test step
      # the run reported a *test* problem. Worse, it is what made `continue-on-error` look
      # survivable — a masked step reported a compile error as a pass. Split, a compile
      # error is red here, with the compiler's own message, and never reaches the simulator.
      #
      # `-derivedDataPath` is explicit so the warm-up below and the artifact upload can name
      # the products without guessing at a hashed directory.
      - name: Build for testing
        working-directory: ios
        run: >
          xcodebuild build-for-testing
          -project Ultimate.xcodeproj
          -scheme UltimateUITests
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      # The other half of the boot above: confirm it finished, now that the compile has given
      # it three minutes to do so. Blocking, and the device is printed because "which simulator
      # did CI actually use" is the first question about a UI test failure that reproduces
      # nowhere else.
      - name: Wait for the simulator
        run: |
          set -euo pipefail
          xcrun simctl bootstatus '${{ steps.sim.outputs.udid }}' -b
          xcrun simctl list devices | grep -F '${{ steps.sim.outputs.udid }}'

      # **There used to be a `Warm the app` step here and deleting it is the fix, not a
      # regression.** It installed the app, launched it, slept 20 s and killed it, so that the
      # first `app.launch()` a test made was not also paying for a cold first install.
      #
      # `MatchDriver.init` already does all of that and does it better: it installs, launches,
      # and then *waits on the probe* — a condition — on the `patience` budget, which is sized
      # for exactly this. The step contributed an unconditional 20 s whether the app reached a
      # frame in three seconds or never launched at all, and being `continue-on-error` it could
      # not report that it had bought nothing. It had also drifted: it warmed
      # `-setup off -probe on`, missing the `-receive` and `-points` the tests actually launch
      # with, so the run it warmed was not the run that followed.
      #
      # Compare `Start the simulator booting` / `Wait for the simulator` above, which is the
      # same problem solved at the right depth: block on the condition, not on a number.

      # **Blocking, and it was briefly not — which was a mistake worth recording.**
      #
      # The first CI run of these tests failed with the probe never appearing after
      # `Unable to monitor event loop` at t=6.81 s: a software renderer trying to draw a
      # RealityKit scene stepping a match at 120 Hz. That is answered by `UITEST_SLOWDOWN`
      # below — every wait in the suite is a multiple of it — and not by a 90 s constant,
      # which turned out to reach only the waits that took `wait`'s default and left the
      # tests' own `timeout: 10` and `timeout: 5` literals running at a laptop's budget.
      # Two tests died on exactly those two literals in run 31384063453.
      #
      # The mistake was also adding `continue-on-error: true` at the same time. The next
      # run went green — and the tests had not run at all, because the suite no longer
      # *compiled*: a stale file had reverted another change's additions. A masked job
      # reports success for a compile error, which is strictly worse than a red job,
      # because a red job gets fixed and a green lie does not. If the runner turns out
      # to be genuinely too slow even at the multiplier set below, the answer is to say so here
      # and skip the job deliberately — not to let it pass while failing.
      #
      # There is no `continue-on-error` step left in this job at all: the one that had it,
      # `Warm the app`, was deleted rather than kept as an exception. See the note where it
      # used to be.
      #
      # `test-without-building` — the compile already happened, and happened in its own step.
      #
      # **`UITEST_SLOWDOWN` is the one timing knob**, and it is set here rather than sniffed.
      #
      # It used to be `CI: "true"`, read by `MatchDriver.patience`, and that was wrong twice
      # over. It was *invisible* to the `wait(timeout: 10)` and `wait(timeout: 5)` literals in
      # the tests, so a run on this software renderer lost two tests to a developer machine's
      # budget while the job looked configured for a slow one. And `CI` is a variable a dozen
      # local tools export for their own reasons, so a developer who happened to have it set
      # ran the whole suite at CI's generous budget and could not have seen a regression that
      # a tight local run fails on. A name nothing else uses, carrying the number rather than
      # a boolean, fixes both: every wait in the suite is a multiple of it, and the multiplier
      # is reviewable here.
      #
      # **`TEST_RUNNER_` prefix, and without it none of the above was true.**
      #
      # `xcodebuild` does not forward the host environment into the test process, which runs in
      # the simulator. Set as a bare `UITEST_SLOWDOWN`, the variable reached `xcodebuild` and
      # stopped there: `MatchDriver.slowdown` read nothing, fell back to its clamp, and every
      # run of this job since the knob was introduced has been at **×1**. Run 31396301991 says
      # so in its own log — `UITEST TIMING: slowdown ×1.0` — under a step that sets 4.
      #
      # `TEST_RUNNER_<NAME>` is the documented mechanism: `xcodebuild` strips the prefix and
      # passes the rest to the test runner. Verified locally by reading the announce line back.
      #
      # This is the third spelling of one mistake — `CI: "true"` was invisible to the tests'
      # timeout literals, the literals were invisible to `UITEST_SLOWDOWN`, and
      # `UITEST_SLOWDOWN` was invisible to the simulator. Each time the job looked tuned and
      # was not. `announce()` printing the multiplier is what finally caught it, which is the
      # argument for printing configuration rather than trusting it.
      #
      # **2, and this number now has a measurement behind it.** It was 4, described as measured
      # when nothing had measured it. Comparing the eleven tests at ×1 on this runner against
      # ×1 locally (run 31396301991 vs. a local pass in 135 s):
      #
      #   median ratio 1.17 — worst 3.05 (`testDragBackToTheOrigin`), then 2.37
      #
      # and the two large ones are *retries*, not slower waits: every individual wait was
      # satisfied at ×1, and those tests took longer because `withTheDisc` spent more attempts,
      # each paying a full budget. So the waits need roughly 1.2–1.4× and 2 is the headroom.
      #
      # **The multiplier is not free, and the measured price of ×2 is 73 s.** The job ran the
      # eleven tests in 215.8 s at ×1 (run 31396301991) and 288.6 s at ×2 (run 31396728400),
      # both green. The cost is not idle waiting: it is `withTheDisc` retries, where a failed
      # attempt polls for the whole of `possession` before relaunching, so every retry pays the
      # budget in full. That is also why the two worst per-test ratios above are retry counts
      # rather than slowness. ×4 would roughly double that surcharge again for no measured
      # benefit, which is the argument against going back to it.
      #
      # One thing ×2 did *not* change, contradicting a guess made when this was written: the tap
      # sampler returns **11 taps at both multipliers**, so it is not bound by `samplingCap`.
      # `RefusalTests` attempts all twelve; the twelfth is simply not visible in the ledger read
      # that follows it. The floor of 8 is what makes that harmless. Do not raise the cap
      # expecting a twelfth tap — the gap is a probe-read ordering artefact, not a budget.
      - name: Run the touch tests
        working-directory: ios
        env:
          TEST_RUNNER_UITEST_SLOWDOWN: "2"
        run: >
          xcodebuild test-without-building
          -project Ultimate.xcodeproj
          -scheme UltimateUITests
          -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO

      # The gestures, the probe readings and the failure screenshots, which are the only way
      # to tell a real regression from a simulator that never booted.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ios/build/Logs/Test/*.xcresult
          retention-days: 7
          if-no-files-found: ignore
