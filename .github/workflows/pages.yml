name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy, but never interrupt a run that is
# already publishing — a half-applied deploy is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Before the typecheck, because for the one defect it catches it is both
      # faster and more accurate. A backtick in a GLSL comment made `tsc` emit
      # 183 errors across a 945-line file, of which one was the fault; the gate
      # emits one, on the right line, with a caret under the character.
      - name: Syntax gate
        run: npm run gate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
