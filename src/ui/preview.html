<!doctype html>
<meta charset="utf-8" />
<title>HUD preview</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  /* A stand-in for the frame the package actually sits on: dark stands across
     the top third where the bug lands, lit turf below where the card lands.
     Only there so contrast is judged against something honest. */
  #stage {
    position: fixed; inset: 0;
    background:
      linear-gradient(180deg,#0a1017 0%,#101a24 26%,#1d2c22 33%,#3f5c34 46%,#4d6b3c 72%,#415c33 100%);
  }
  #stage::after {
    content: ''; position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 38px, rgba(0,0,0,.02) 38px 76px);
  }

  #stage.sheet {
    position: static; height: auto; overflow: visible;
    background: linear-gradient(180deg,#0b1119,#16202b);
    padding: 26px 0 40px;
  }
  html:has(#stage.sheet), body:has(#stage.sheet) { overflow: auto; height: auto; }
  .sheet-row { padding: 0 0 6px; }
  .sheet-cap {
    font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .16em; text-transform: uppercase; color: #6f89a8;
    padding: 0 0 6px 28px;
  }
</style>
<div id="stage"></div>
<script type="module" src="/src/ui/preview.ts"></script>
