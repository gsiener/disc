<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ULTIMATE — Championship Disc</title>
<meta name="description" content="7v7 Ultimate Frisbee in Three.js with zero binary assets — real disc aerodynamics, procedural everything." />
<meta name="theme-color" content="#05070a" />
<!-- Inline so the page ships no binary assets, consistent with the rest of the project. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Cellipse cx='16' cy='17' rx='11' ry='4.6' fill='none' stroke='%237cc2ff' stroke-width='2.2'/%3E%3Cellipse cx='16' cy='14.6' rx='11' ry='4.6' fill='%232b6cff' fill-opacity='.28' stroke='%23cfe3ff' stroke-width='2.2'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #boot {
    position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
    background: #05070a; color: #cfe3ff; transition: opacity .6s ease;
    font-variant-numeric: tabular-nums; letter-spacing: .18em; font-size: 12px; text-transform: uppercase;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .bar { margin-top: 14px; width: 220px; height: 2px; background: #12203a; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#2b6cff,#7cc2ff); transition: width .25s ease; }
</style>
<div id="app"></div>
<div id="ui"></div>
<div id="boot"><div><div id="boot-label">Initializing</div><div class="bar"><i id="boot-bar"></i></div></div></div>
<script type="module" src="/src/main.ts"></script>
